{{ define "main" }}
  <section class="content-section">
    <div class="section-heading">
      <p class="eyebrow">Tag</p>
      <h1>{{ .Title }}</h1>
    </div>
    <div class="card-list">
      {{ range .Pages.ByDate.Reverse }}
        <article class="entry-card">
          <p class="entry-meta">{{ .Date | time.Format ":date_long" }}</p>
          <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
          <p>{{ with .Summary }}{{ . | plainify }}{{ else }}Open the lesson note to read the full reflection.{{ end }}</p>
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}
